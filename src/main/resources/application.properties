spring.application.name=shipmenttrackingportal

server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_db
spring.datasource.username=postgres
spring.datasource.password=vttamil17

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
 
# --- Disable Springdoc in tests to speed up context load ---
springdoc.api-docs.enabled=false


# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret - injected via environment variable
app.jwt.secret=2f8f5d61b6cb9e14663114e9fa0d0fb563d2a33cc0f6fe3908c9ef71babb47bc
app.jwt.expiration-ms=86400000

# Springdoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.infotact=DEBUG
logging.level.org.springframework.web.socket=INFO